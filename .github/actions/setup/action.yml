name: Setup
description: Install Python, uv, just, dependencies, and build the package

inputs:
  python-version:
    description: Python version to use
    required: false
    default: "3.13"
  version:
    description: Package version used for the build step
    required: false
    default: "0.0.1"

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install uv
      uses: astral-sh/setup-uv@v4
    - name: Install just
      uses: extractions/setup-just@v3
    - name: Use uv with Python version
      run: uv venv --python ${{ inputs.python-version }}
      shell: bash
    - name: Install dependencies
      run: just install
      shell: bash
      env:
        PYTHON_VERSION: ${{ inputs.python-version }}
    - name: Build
      env:
        VERSION: ${{ inputs.version }}
        PYTHON_VERSION: ${{ inputs.python-version }}
      run: just build
      shell: bash
