name: Run unit tests
description: Run pyright checks and unit tests

inputs:
  python-version:
    description: Python version to use
    required: false
    default: "3.13"

runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup
      with:
        python-version: ${{ inputs.python-version }}
    - name: Run pyright
      run: just check
      shell: bash
    - name: Run unit tests
      run: just test tests/unit-tests/
      shell: bash
      env:
        PYTHON_VERSION: ${{ inputs.python-version }}
