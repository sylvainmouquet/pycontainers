name: Run Tests

runs:
  using: 'composite'
  steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 10
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install uv
      uses: astral-sh/setup-uv@v4
    - name: Install just
      uses: extractions/setup-just@v3
    - name: Use uv with Python version
      run: uv venv --python ${{ matrix.python-version }}
      shell: bash
    - name: Install dependencies
      run: just install
      shell: bash
    - name: Build
      env:
        VERSION: 0.0.1
      run: just build
      shell: bash
    - name: Run pyright
      run: just check
      shell: bash
    - name: Run tests
      run: |
        just test
      shell: bash
      env:
        PYTHON_VERSION: ${{ matrix.python-version }}
