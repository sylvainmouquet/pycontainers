name: Run Tests

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'
  workflow_dispatch:

jobs:
  test:
    name: unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/test
        with:
          python-version: ${{ matrix.python-version }}
      - name: Post coverage comment
        if: github.event_name == 'pull_request'
        uses: py-cov-action/python-coverage-comment-action@v3
        with:
          GITHUB_TOKEN: ${{ github.token }}

  test-docker:
    name: docker
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          python-version: ${{ matrix.python-version }}
      - name: Configure host.docker.internal
        run: echo "172.17.0.1 host.docker.internal" | sudo tee -a /etc/hosts
        shell: bash
      - name: Run Docker backend tests
        run: just test-docker
        shell: bash
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}

  test-podman:
    name: podman
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@v4
      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman
        shell: bash
      - uses: ./.github/actions/setup
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run Podman backend tests
        run: just test-podman
        shell: bash
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}

  test-container:
    name: container
    runs-on: macos-latest
    strategy:
      matrix:
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run Apple container backend tests
        run: just test-container
        shell: bash
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
