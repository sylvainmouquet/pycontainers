name: Run Tests

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'
  workflow_dispatch:


jobs:

  test-ubuntu:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.13" ] # 3.10', '3.11', '3.12',
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: ./.github/actions/test

  test-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        python-version: [ "3.13" ]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      - name: Install just
        uses: extractions/setup-just@v3
      - name: Use uv with Python version
        run: uv venv --python ${{ matrix.python-version }}
        shell: bash
      - name: Install dependencies
        run: just install
        shell: bash
      - name: Build
        env:
          VERSION: 0.0.1
        run: just build
        shell: bash
      - name: Run macOS unit and smoke tests
        run: |
          uv run pytest -v \
            tests/unit-tests/test_utils.py \
            tests/unit-tests/test_model.py \
            tests/unit-tests/test_config.py \
            tests/unit-tests/test_macos_commands.py \
            tests/unit-tests/test_detection.py \
            tests/smoke/
        shell: bash
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}