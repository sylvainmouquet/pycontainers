name: Test local installation

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'
  workflow_dispatch:

jobs:
  test-install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.14

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install just
        uses: extractions/setup-just@v3

      - name: Use uv with Python version
        run: uv venv --python 3.14

      - uses: ./.github/actions/checkout-proxycraft

      - name: Install dependencies
        run: just install

      - name: Run Docker example
        run: just example-docker
        env:
          PYTHON_VERSION: "3.14"